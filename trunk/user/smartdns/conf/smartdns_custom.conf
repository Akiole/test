### 优化说明：
###   - 移除 -spki-pin 固定证书指纹，改用系统CA验证，避免指纹过期导致连接失败
###   - 国内TLS服务器加入 Safe 和 Over 组
###   - 海外DNS仅加入 Over 组并排除默认组
###   - 可为UDP上游添加 -check-edns 参数

# 【基础 DNS（备用，取消注释即生效）】
# server-tcp 114.114.114.114:53 -group Safe -exclude-default-group
# server-tcp 1.2.4.8:53 -group Safe -exclude-default-group
# server-tcp 223.5.5.5:53 -group Safe -exclude-default-group
# server-tcp 119.29.29.29:53 -group Safe -exclude-default-group

# TLS CA 证书（移除 spki-pin 后必须配置，否则 TLS 验证失败）
ca-file /etc/ssl/certs/ca-certificates.crt

# 【国内 plain DNS（可靠备份，确保国内域名始终可解析）】
server 223.5.5.5:53 -blacklist-ip -group Safe
server 119.29.29.29:53 -blacklist-ip -group Safe
server 101.226.4.6:53 -blacklist-ip -group Safe

# ①【AliDNS 阿里公共DNS（TLS加密）】
# server-https https://223.5.5.5/dns-query -blacklist-ip -host-name dns.alidns.com -group Safe
server-tls 223.5.5.5:853 -blacklist-ip -host-name public1.alidns.com -group Safe -group Over

# ②【DNSPod 腾讯公共DNS】
# server-https https://1.12.12.12/dns-query -blacklist-ip -host-name doh.pub -group Safe
server-tls 162.14.21.56:853 -blacklist-ip -host-name dot.pub -group Safe -group Over

# ③【360安全DNS】
server-tls 101.199.113.208:853 -blacklist-ip -host-name dot.360.cn -group Safe -group Over

# ④【海外DNS - 台湾中华电信/Quad101】
server 101.101.101.101:53 -group Over -exclude-default-group
server 168.95.1.1:53 -group Over -exclude-default-group

# ⑤【海外DNS - Cloudflare（可选，网络可达时取消注释）】
# server-tls 1.1.1.1:853 -blacklist-ip -host-name cloudflare-dns.com -group Over -exclude-default-group
# server-tls 1.0.0.1:853 -blacklist-ip -host-name cloudflare-dns.com -group Over -exclude-default-group

### 域名分流 - 海外域名直接走 Over 组
### GitHub 系列
domain-rules /github.com/ -c none -n Over
domain-rules /githubapp.com/ -c none -n Over
domain-rules /github.io/ -c none -n Over
domain-rules /githubusercontent.com/ -c none -n Over
domain-rules /githubassets.com/ -c none -n Over
domain-rules /codeload.github.com/ -c none -n Over
domain-rules /github-cloud.s3.amazonaws.com/ -c none -n Over
### Google 系列
domain-rules /google.com/ -c none -n Over
domain-rules /googleapis.com/ -c none -n Over
domain-rules /googleusercontent.com/ -c none -n Over
domain-rules /ggpht.com/ -c none -n Over
domain-rules /gstatic.com/ -c none -n Over
domain-rules /googlevideo.com/ -c none -n Over
